[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-leader-election"
version = "0.1.0"
description = "Distributed bully and consensus leader election for decentralized swarms of autonomous agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-leader-election = "agent_leader_election.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_leader_election*"]
